<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Catness Mail Web</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="app">

    <header>
        <h1>Catness Mail</h1>
        <button id="login">Połącz z Gmailem</button>
    </header>

    <main>
        <aside id="sidebar">
            <button id="loadMessages" class="sidebar-btn">📨 Odebrane</button>
            <button id="composeBtn" class="sidebar-btn">✉️ Napisz</button>

            <ul id="mailList"></ul>
        </aside>

        <section id="content">
            <div id="mailView">
                <h2>Wybierz wiadomość</h2>
                <pre id="mailContent"></pre>
            </div>

            <div id="composer" style="display:none;">
                <h2>Nowa wiadomość</h2>

                <label>Do:</label>
                <input id="composeTo" type="text">

                <label>Temat:</label>
                <input id="composeSubject" type="text">

                <label>Treść:</label>
                <textarea id="composeBody"></textarea>

                <button id="sendMail">Wyślij</button>
            </div>
        </section>
    </main>

</div>

<script src="mail.js"></script>
</body>
</html>
